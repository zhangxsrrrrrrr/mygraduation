<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:replace="body::head"/>

</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div th:replace="body::#header"></div>
    <div th:replace="body::#side"></div>
	<div th:insert="body::#script"></div>


	<div class="layui-body" id="body">
        <!-- 内容主体区域 -->
		<div class="layui-upload-drag" id="uploadDemo">
			<i class="layui-icon"></i>
			<p>点击上传，或将文件拖拽到此处</p>
			<div class="layui-hide" id="uploadDemoView">
				<hr>
				<img src="" alt="上传成功后渲染" style="max-width: 100%">
			</div>
		</div>

		<br />
		<table class="layui-table" lay-data="{height:315, url:'/teacher/upFiles', page:true, id:'test'}" lay-filter="test">
			<thead>
			<tr>
				<th lay-data="{field:'id', width:80, sort: true}">文件名</th>
				<th lay-data="{field:'username', width:80}">上传者</th>

			</tr>
			</thead>
		</table>
		<!--内容结束 -->
    </div>
	<script src="layui.js"></script>
	<!-- script -->
	<script>
		layui.use(['laydate', 'laypage', 'layer', 'table', 'carousel', 'upload', 'element', 'slider'], function(){
			var laydate = layui.laydate //日期
					,laypage = layui.laypage //分页
					,layer = layui.layer //弹层
					,table = layui.table //表格
					,carousel = layui.carousel //轮播
					,upload = layui.upload //上传
					,element = layui.element //元素操作
					,slider = layui.slider //滑块
			//上传
			upload.render({
				elem: '#uploadDemo'
				,url: '/teacher/upFiles' //改成您自己的上传接口
				,accept: 'file'
				,done: function(res){
					layer.msg('上传成功');
					layui.$('#uploadDemoView').removeClass('layui-hide').find('img').attr('src', res.files.file);
					console.log(res)
				}
			});

		});
	</script>
    <div class="layui-footer">
        <!-- 底部固定区域 -->
        © 张汛的毕业设计作品 2021.2
    </div>
</div>

</body>
</html>
