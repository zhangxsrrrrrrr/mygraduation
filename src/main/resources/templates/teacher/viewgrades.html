<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head >

    <link th:replace="body::head">
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div th:replace="body::#header"></div>
    <div th:replace="body::#side"></div>

    <div class="layui-body" id="body">
        <!-- 内容主体区域 -->

        <form class="layui-form" action="/teacher/selectid" method="get">
            <label th:text="${msg}"></label>
            <div class="layui-form-item">
                <label class="layui-form-label">输入课程号</label>
                <div class="layui-input-block">
                    <input type="text" name="courseid" lay-verify="title" autocomplete="off" placeholder="请输入课程号" class="layui-input">
                </div>
            </div>
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-radius">提交查看</button>
        </form>
		<table class="layui-hide" id="demo" lay-filter="test">

		</table>
		 
		<script src="layui.js"></script>
		<script>
		layui.use('table', function(){
		  var table = layui.table;
		  
		  //第一个实例
		  table.render({
		    elem: '#demo'
		    ,height: 312
		    ,url: '/teacher/viewgrades' //数据接口
		    ,page: true //开启分页
		    ,cols: [
		        [ //表头
               {field: 'course', title: '学科', width:80}
		      ,{field: 'id', title: '学号', width:100, sort: true}
		      ,{field: 'username', title: '姓名', width:80}
		      ,{field: 'grade', title: '成绩', width:80, sort: true}
		      // ,{field: 'sign', title: '签名', width: 177}
		      // ,{field: 'experience', title: '积分', width: 80, sort: true}
		      // ,{field: 'score', title: '评分', width: 80, sort: true}
		      // ,{field: 'classify', title: '职业', width: 80}
		      // ,{field: 'wealth', title: '财富', width: 135, sort: true}
		    ]
              ]
		  });
		  
		});
		</script>
		<!--内容结束 -->
    </div>

    <div class="layui-footer">
        <!-- 底部固定区域 -->
        © 张汛的毕业设计作品 2021.2
    </div>
</div>
<script src="../../static/student/layui.js"></script>
<script>
//JavaScript代码区域
layui.use('element', function(){
  var element = layui.element;
  
});
</script>
</body>
</html>
