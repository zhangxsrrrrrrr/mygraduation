<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:include="body::head">
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div th:replace="body::#header"></div>
    <div th:replace="body::#side"></div>
    <div th:insert="body::#script"></div>

    <div class="layui-body" id="body">
        <!-- 内容主体区域 -->
		<div class="layui-upload-drag" id="test10">
		  <i class="layui-icon"></i>
		  <p>点击上传，或将文件拖拽到此处</p>
		  <div class="layui-hide" id="uploadDemoView">
		    <hr>
		    <img src="" alt="上传成功后渲染" style="max-width: 196px">
		  </div>
		</div>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px;">
            <legend>单个导入</legend>
        </fieldset>
        <label class="layui-form-label" th:text="${msg}"></label>
        <form class="layui-form" action="/teacher/addSingleStudent" method="post">
            <div class="layui-form-item">
                <label class="layui-form-label">学号</label>
                <div class="layui-input-block">
                    <input type="text" name="stuId" lay-verify="title" autocomplete="off" placeholder="请输入标题" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">姓名</label>
                <div class="layui-input-block">
                    <input type="text" name="stuName" lay-verify="title" autocomplete="off" placeholder="请输入标题" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">课程号</label>
                <div class="layui-input-block">
                    <input type="text" name="courseId" lay-verify="title" autocomplete="off" placeholder="请输入标题" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <button class="layui-btn" lay-submit="" lay-filter="demo2">提交</button>
            </div>
        </form>
		<!--内容结束 -->
    </div>
<script>
layui.use('upload', function() {
    var $ = layui.jquery
        , upload = layui.upload;

    upload.render({
        elem: '#test10'
        , url: '/teacher/authorization' //改成您自己的上传接口
        , accept: 'file'
        , choose: function (obj) {
            var file = obj.pushFile();
           console.log(file)
        }
        , done: function (res) {
            layer.msg('上传成功');
            // layui.$('#uploadDemoView').removeClass('layui-hide').find('xlsx').attr('src', res.files.file);
            // console.log(res)
        }

    });
})
 </script>
    <div class="layui-footer">
        <!-- 底部固定区域 -->
        © 张汛的毕业设计作品 2021.2
    </div>
</div>

</body>
</html>
